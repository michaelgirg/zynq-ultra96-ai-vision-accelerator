name: Portable Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-and-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check Python syntax
        run: python -m compileall -q scripts pytorch
      - name: Check generated artifacts, register map, and text hygiene
        run: python scripts/check_repo_consistency.py
      - name: Validate vector predictor
        run: python scripts/validate_vector_predictor.py
      - name: Verify checkpoint, coefficients, classifier, and evaluation pairing
        run: python scripts/check_vector_model_bundle.py
      - name: Reject mixed artifacts and test-set candidate selection
        run: python -m unittest discover -s scripts -p test_vector_bundle.py
      - name: Validate portable C classifier against PyTorch golden logits
        run: python scripts/validate_vector_classifier.py
      - name: Validate candidate C classifier against PyTorch golden logits
        run: python scripts/validate_vector_classifier.py --model-dir generated/candidates/vector_conv4/classifier
      - name: Test fail-closed ARM boot helper
        run: python scripts/validate_rv32_boot.py
      - name: Check benchmark evidence boundaries
        run: python -m unittest discover -s scripts -p test_vision_benchmark.py

  pytorch-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU training dependencies
        run: pip install -r requirements.txt --index-url https://download.pytorch.org/whl/cpu
      - name: Validate split isolation, metrics, packing, and classifier scale folding
        run: python -m unittest discover -s pytorch -p test_vector_training.py
      - name: Re-derive frozen baseline and candidate exports
        run: |
          python pytorch/export_vector_classifier.py --check-only
          python pytorch/export_vector_classifier.py --check-only --checkpoint generated/candidates/vector_conv4/vector_conv4_cnn.pt --front-manifest generated/candidates/vector_conv4/evaluation/front_manifest.json --output-dir generated/candidates/vector_conv4/classifier
      - name: Re-export baseline classifier from the saved PyTorch checkpoint
        run: python pytorch/export_vector_classifier.py --output-dir generated/experiments/ci-classifier
      - name: Compare re-exported C classifier with PyTorch
        run: python scripts/validate_vector_classifier.py --model-dir generated/experiments/ci-classifier
      - uses: actions/cache@v4
        with:
          path: generated/data
          key: mnist-official-idx-v1
      - name: Download official MNIST test data
        run: python -c "from torchvision.datasets import MNIST; MNIST('generated/data', train=False, download=True)"
      - name: Validate all 10000 test images through native C classifier
        run: python pytorch/validate_vector_dataset.py --output generated/experiments/ci-c-dataset.json

  rtl-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install --yes verilator
      - name: Lint vector AXI4-Stream IP
        run: verilator --lint-only --sv --timing --Wall --Wno-fatal --top-module axis_preprocess_vector_axi_lite -f scripts/rtl_filelist.f
      - name: Lint dual-clock wrapper
        run: verilator --lint-only --sv --timing --Wall --Wno-fatal --top-module axis_preprocess_vector_cdc -f scripts/rtl_filelist.f
      - name: Lint RV32 heterogeneous subsystem
        run: verilator --lint-only --sv --timing --Wall --Wno-fatal --top-module rv32_pipeline_axi_subsystem -f scripts/rtl_rv32_filelist.f
      - name: Lint job mailbox and diagnostics
        run: verilator --lint-only --sv --timing --Wall --Wno-fatal --top-module rv32_job_mailbox rtl/riscv/soc/rv32_job_mailbox.sv

  rv32-firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bare-metal RISC-V toolchain
        run: sudo apt-get update && sudo apt-get install --yes gcc-riscv64-unknown-elf binutils-riscv64-unknown-elf
      - name: Build firmware and host-loadable images
        run: make -C software/riscv PYTHON=python3
      - name: Verify reset-vector placement
        shell: bash
        run: |
          entry=$(riscv64-unknown-elf-readelf -h software/riscv/build/controller.elf | awk '/Entry point address/ {print $4}')
          text_addr=$(riscv64-unknown-elf-objdump -h software/riscv/build/controller.elf | awk '$2 == ".text" {print $4}')
          test "$entry" = "0x0"
          test "$text_addr" = "00000000"
      - name: Execute complete application with functional DMA/cache model
        run: python3 scripts/validate_vision_app.py --cc gcc --sanitize
      - name: Compile ARM boot helper contract
        run: >-
          riscv64-unknown-elf-gcc -march=rv32im -mabi=ilp32 -ffreestanding
          -Wall -Wextra -Werror -Isoftware/ultra96 -Isoftware/riscv/include
          -include software/riscv/build/controller_images.h
          -c software/ultra96/rv32_controller.c
          -o software/riscv/build/rv32_controller_host_check.o

  bounded-formal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Yosys
        run: sudo apt-get update && sudo apt-get install --yes yosys
      - name: Check real AXI master safety and detect intentional defect
        run: python scripts/run_bounded_formal.py --depth 32
